      #   with:
      #     keyvault: ${{ vars.AZURE_KEY_VAULT_NAME }}
      #     secrets: ${{ vars.AZURE_KEY_VAULT_SECRET_NAME__FUNC_APP_PUBLISH_PROFILE }}

      # - name: What are the secrets?
      #   run: echo ${{ steps.get-kevault-secrets.outputs.* }}

