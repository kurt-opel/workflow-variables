name: My Test Repo Reporter

on:
  push:
    branches:
      - develop
      - stage
      - master

  pull_request:
    branches:
      - develop
      - stage
      - master

  workflow_dispatch:

concurrency:
  group: build-and-deploy-${{ github.head_ref }}
  cancel-in-progress: true

env:
  WORKFLOW_REPO_VARIABLE: ${{ vars.REPO_VARIABLE_NAME }}
  WORKFLOW_ENVIRONMENT: ${{ github.ref_name == 'master' && 'prod' || github.ref_name == 'develop' && 'development' || github.ref_name }}

jobs:
  reporter:
    name: Report the variables and secrets values
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'master' && 'prod' || github.ref_name == 'develop' && 'development' || github.ref_name  }}
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Echo event name
        run: echo ${{ github.event_name }}
        
      # - name: Azure Login
      #   uses: azure/login@v2
      #   with:
      #     auth-type: IDENTITY
      #     client-id: ${{ secrets.AZURE_CLIENT_ID }}
      #     subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      #     tenant-id: ${{ secrets.AZURE_TENANT_ID }}
      #     enable-AzPSSession: true
      - name: Azure Login
        run: az login --service-principal --username ${{ secrets.AZURE_CLIENT_ID }} --password ${{ secrets.AZURE_CLIENT_SECRET }} --tenant ${{ secrets.AZURE_TENANT_ID }}

      - name: Azure CLI script
        uses: azure/cli@v2
        with:
          # azcliversion: latest
          inlineScript: |
            az account show

      - name: Azure PowerShell script
        uses: azure/powershell@v2
        with:
          azPSVersion: latest
          inlineScript: |
            Get-AzContext

      - name: Get secret from keyvault
        run: |
          gh_secret=$(az keyvault secret show --name GitHub --vault-name kv-github-workflow-test --query value)
          echo "Secret value: $gh_secret"
          echo "SECRET_VALUE=$gh_secret" >> $GITHUB_ENV

      - name: Output Secret Value
        run: echo "SecretValue is $SECRET_VALUE"

      # - uses: azure/get-keyvault-secrets@v1
